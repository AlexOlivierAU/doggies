name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dog_rater_live
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6 libgl1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-desktop.txt
      - name: Compile
        run: python -m compileall -q -x '.venv|.git' .
      - name: Ruff
        run: ruff check services ui tests desktop
      - name: Pytest
        run: pytest -q
      - name: Import desktop entry (no event loop)
        run: python -c "from desktop.main import create_app; print('desktop import ok')"
